<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Glassmorphic highlights -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#glassTop)" stroke-width="4" />

  <!-- Modern 'T' mark -->
  <g filter="url(#shadow)">
    <!-- Top bar -->
    <rect x="140" y="160" width="232" height="56" rx="28" fill="#FFFFFF" />
    <!-- Vertical bar -->
    <rect x="228" y="180" width="56" height="180" rx="28" fill="#FFFFFF" />
  </g>
  
  <!-- Glass accent over the T -->
  <rect x="228" y="216" width="56" height="80" rx="28" fill="rgba(255, 255, 255, 0.2)" />
</svg>